name: Bug Report
description: 'Report any bugs or any issues you have found while using the DupePlus Plugin. '
type: bug
labels:
  - bug
body:
  - type: input
    id: serverversion
    attributes:
      label: Server Version
      description: What Minecraft server version & platform do you use for DupePlus?
      placeholder: "PaperMC 26.3"
    validations:
      required: true
  - type: textarea
    id: stepstoreproduce
    attributes:
      label: How to reproduce?
      description: Explain how to reproduce the bug.
      placeholder: /dupe with no items on you.
    validations:
      required: true
  - type: textarea
    id: expectedresult
    attributes:
      label: Expected Behaviour
      description: What was expected to happen?
      placeholder: Describe what you expected to happen here.
    validations:
      required: true
  - type: textarea
    id: actualresult
    attributes:
      label: Actual Result
      description: What actually happened.
      placeholder: An error log or something else helpful.
    validations:
      required: true
  - type: textarea
    id: describingbug
    attributes:
      label: Describe the Bug
      description: Use images, text or videos to describe the bug.
    validations:
      required: false

